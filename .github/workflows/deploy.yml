name: deploy

on:
  push:
    branches: [main]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-22.04
        steps:
          - name: Checkout
            uses: actions/checkout@v3

          - name: OIDC
            uses: aws-actions/configure-aws-credentials@v2
            with:
              role-to-assume: arn:aws:iam::758890598971:role/GitHubActionRole
              aws-region: eu-central-1

          - name: Terraform
            run: |
              terraform init
              terraform apply -auto-approve
              
